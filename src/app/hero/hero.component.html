<div>
  <div id="hero" class="hero-container margin-top-110px">
    <div class="hero-image-wrapper">
      <img
        class="photo-shadow"
        src="assets/imgs/shadows/photo-shadow.svg"
        alt=""
      />
      <img
        class="me1"
        src="assets/imgs/about-me-icons/at-the-camera.png"
        alt=""
      />
    </div>

    <div class="hero-right-side">
      <div class="name-area">
        <span>{{ translation.t("hero.bin") }}</span>
        <div class="name-title">
          <p>Rahaf Jarrous</p>
          <div class="frontend-developer">
            {{ translation.t("hero.frontend_developer") }}
          </div>
        </div>
      </div>
      <button (click)="scroll.scrollTo('contact')">
        {{ translation.t("hero.talk") }}
      </button>
    </div>

    <img class="vector" src="assets/imgs/remaining-icons/vector.svg" alt="" />
  </div>

  <div class="hero-footer">
    <div class="hero-footer-icons">
      <img src="assets/imgs/lines/hero-line.svg" alt="" />
      <img
        class="social-media-icon"
        (click)="scroll.scrollTo('contact')"
        src="assets/imgs/socialmedia/email-button.svg"
        alt=""
      />
      <a
        href="https://github.com/rahaf-jar"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          class="social-media-icon"
          src="assets/imgs/socialmedia/github-button.svg"
          alt="GitHub"
        />
      </a>
      <a
        href="https://www.linkedin.com/in/rahaf-jarrous-97277527b/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          class="social-media-icon"
          src="assets/imgs/socialmedia/linkedin-button.svg"
          alt="LinkedIn"
        />
      </a>
      <a class="email" (click)="scroll.scrollTo('contact')">
        jarrousrahaf&#64;gmail.com
      </a>
    </div>

    <div class="scroll-down">
      <img
        (click)="scroll.scrollTo('footer')"
        src="assets/imgs/remaining-icons/go-up-button.svg"
        alt=""
      />
    </div>
  </div>
</div>
